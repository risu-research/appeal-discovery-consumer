services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null 2>&1"]
      interval: 2s
      timeout: 4s
      retries: 15
  device:
    build:
      context: ..
      dockerfile: e3_mqtt/app/Dockerfile
    command: ["python", "/app/device.py"]
    environment: {BROKER_HOST: mosquitto, BROKER_PORT: "1883"}
    depends_on: {mosquitto: {condition: service_healthy}}
  runner_ladder:
    build: {context: .., dockerfile: e3_mqtt/app/Dockerfile}
    command: ["python", "/app/ladder_v2.py", "--broker", "mosquitto", "--tasks", "128", "--wave-size", "32", "--wave-period-ms", "300", "--verify-floor-ms", "100", "--source-guard-ms", "20", "--changed-delay-floor-ms", "150", "--target-margin-ms", "50", "--post-completion-gap-ms", "20", "--trials", "12", "--out", "/results/e3b_r0_r1_r2_certificate.json"]
    environment: {BROKER_HOST: mosquitto, BROKER_PORT: "1883", BROKER_IMAGE: "eclipse-mosquitto:2.1.2-alpine"}
    volumes: ["./results:/results"]
    depends_on: {mosquitto: {condition: service_healthy}, device: {condition: service_started}}
  runner_sweep:
    build: {context: .., dockerfile: e3_mqtt/app/Dockerfile}
    command: ["python", "/app/safety_sweep.py", "--broker", "mosquitto", "--tasks", "128", "--wave-size", "32", "--wave-period-ms", "300", "--verify-floor-ms", "100", "--source-guard-ms", "20", "--offsets-ms=-40,-20,-5,0,10,25,50", "--paired-trials", "3", "--out", "/results/e3b_replay_safety_sweep.json"]
    environment: {BROKER_HOST: mosquitto, BROKER_PORT: "1883"}
    volumes: ["./results:/results"]
    depends_on: {mosquitto: {condition: service_healthy}, device: {condition: service_started}}
