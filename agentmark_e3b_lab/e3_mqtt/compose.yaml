services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null 2>&1"]
      interval: 2s
      timeout: 4s
      retries: 15
  device:
    build:
      context: ..
      dockerfile: e3_mqtt/app/Dockerfile
    command: ["python", "/app/device.py"]
    environment: {BROKER_HOST: mosquitto, BROKER_PORT: "1883", BROKER_IMAGE: "eclipse-mosquitto:2.1.2-alpine"}
    depends_on:
      mosquitto: {condition: service_healthy}
  runner_ladder:
    build:
      context: ..
      dockerfile: e3_mqtt/app/Dockerfile
    command: ["python", "/app/ladder.py", "--broker", "mosquitto", "--tasks", "128", "--wave-size", "32", "--wave-period-ms", "300", "--verify-ms", "100", "--changed-delay-ms", "150", "--post-completion-gap-ms", "20", "--trials", "12", "--out", "/results/e3b_r0_r1_r2_certificate.json"]
    environment: {BROKER_HOST: mosquitto, BROKER_PORT: "1883", BROKER_IMAGE: "eclipse-mosquitto:2.1.2-alpine"}
    volumes: ["./results:/results"]
    depends_on:
      mosquitto: {condition: service_healthy}
      device: {condition: service_started}
