name: AgentMark Paper Results Freeze

on:
  workflow_dispatch:
  push:
    branches: [agentmark-paper-results-freeze]
    paths:
      - 'agentmark_paper/**'
      - '.github/workflows/agentmark-paper-results-freeze.yml'
  pull_request:
    paths:
      - 'agentmark_paper/**'
      - '.github/workflows/agentmark-paper-results-freeze.yml'

permissions:
  contents: read

concurrency:
  group: agentmark-paper-results-freeze-${{ github.ref }}
  cancel-in-progress: false

jobs:
  closure:
    name: Canonical results closure
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compile freeze tooling
        run: |
          set -euo pipefail
          python3 -m py_compile \
            agentmark_paper/scripts/paper_results_lib.py \
            agentmark_paper/scripts/extract_paper_results.py \
            agentmark_paper/scripts/validate_paper_results.py \
            agentmark_paper/scripts/generate_paper_views.py \
            agentmark_paper/scripts/independent_paper_audit.py \
            agentmark_paper/tests/test_paper_results.py

      - name: Validate sealed evidence and canonical manifest
        run: |
          set -euo pipefail
          python3 agentmark_paper/scripts/validate_paper_results.py

      - name: Prove manifest reproducibility
        run: |
          set -euo pipefail
          python3 agentmark_paper/scripts/extract_paper_results.py --check

      - name: Prove manuscript-view reproducibility
        run: |
          set -euo pipefail
          python3 agentmark_paper/scripts/generate_paper_views.py --check

      - name: Run independent second-implementation audit
        run: |
          set -euo pipefail
          python3 agentmark_paper/scripts/independent_paper_audit.py

      - name: Run adversarial tamper suite
        run: |
          set -euo pipefail
          python3 -m unittest discover \
            -s agentmark_paper/tests \
            -p 'test_*.py' \
            -v

      - name: Assert closure is mutation-free
        run: |
          set -euo pipefail
          find agentmark_paper -type d -name '__pycache__' -prune -exec rm -rf {} +
          test -z "$(git status --porcelain --untracked-files=all -- agentmark_paper)"
