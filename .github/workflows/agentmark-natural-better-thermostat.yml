name: AgentMark N2 Better Thermostat Action Identity

on:
  workflow_dispatch:
  push:
    branches: [agentmark-theory-lock]
    paths:
      - 'agentmark_natural_controllers/better_thermostat/**'
      - 'agentmark_natural_controllers/action_identity.py'
      - '.github/workflows/agentmark-natural-better-thermostat.yml'

permissions:
  contents: read

jobs:
  resolve-image:
    runs-on: ubuntu-24.04
    outputs:
      image_ref: ${{ steps.pin.outputs.image_ref }}
    steps:
      - name: Resolve and enforce exact Home Assistant image
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          expected='ghcr.io/home-assistant/home-assistant@sha256:372d991e58882a1d8c68c07e9aa3f3b509276e695355f73ccdb03baa70407293'
          tag='ghcr.io/home-assistant/home-assistant:2026.9.0'
          docker pull "$tag"
          ref="$(docker inspect --format='{{index .RepoDigests 0}}' "$tag")"
          test "$ref" = "$expected"
          echo "image_ref=$ref" >> "$GITHUB_OUTPUT"

  n2:
    needs: resolve-image
    strategy:
      fail-fast: false
      matrix:
        replica: [0, 1]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Compile frozen N2 producer, adapter, validator, and aggregate
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            agentmark_natural_controllers/action_identity.py \
            agentmark_natural_controllers/better_thermostat/experiment.py \
            agentmark_natural_controllers/better_thermostat/validate_result.py \
            agentmark_natural_controllers/better_thermostat/aggregate_replicas.py \
            agentmark_e3b_lab/agentmark/kernel.py \
            agentmark_e3b_lab/agentmark/minimize.py \
            agentmark_e3b_lab/agentmark/semantics.py

      - name: Fetch exact external controller and pin provenance
        shell: bash
        env:
          IMAGE_REF: ${{ needs.resolve-image.outputs.image_ref }}
          REPLICA: ${{ matrix.replica }}
        run: |
          set -euo pipefail
          mkdir -p n2_results/provenance
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import urllib.request
          url = 'https://raw.githubusercontent.com/n3roGit/MyHomeAssistantMods/57d56f076c05ccaa9553e6bd4b673b6d43a8cf7f/automation/BetterThermostatControl/BetterThermostat_RoomHeatControl_Lean.yaml'
          expected = '16d52ce11dec44fa9ca533d15f3cec1eb9646d59bf6a455bd905af63cdf86443'
          req = urllib.request.Request(url, headers={'User-Agent':'AgentMark-N2/1'})
          with urllib.request.urlopen(req, timeout=30) as response:
              payload = response.read()
          actual = hashlib.sha256(payload).hexdigest()
          assert actual == expected, (actual, expected)
          Path('n2_results/better_thermostat_lean.yaml').write_bytes(payload)
          Path('n2_results/provenance/EXTERNAL_SOURCE_URL.txt').write_text(url + '\n')
          Path('n2_results/provenance/EXTERNAL_SOURCE_SHA256.txt').write_text(actual + '\n')
          PY
          printf '%s\n' "$IMAGE_REF" > n2_results/provenance/HOME_ASSISTANT_IMAGE_REF.txt
          printf '%s\n' "$GITHUB_SHA" > n2_results/provenance/GITHUB_SHA.txt
          printf '%s\n' "$REPLICA" > n2_results/provenance/REPLICA.txt
          sha256sum \
            agentmark_natural_controllers/action_identity.py \
            agentmark_natural_controllers/better_thermostat/PREREGISTRATION.md \
            agentmark_natural_controllers/better_thermostat/experiment.py \
            agentmark_natural_controllers/better_thermostat/validate_result.py \
            agentmark_natural_controllers/better_thermostat/aggregate_replicas.py \
            n2_results/better_thermostat_lean.yaml \
            > n2_results/provenance/SOURCE_SHA256.txt

      - name: Pull exact immutable Home Assistant image
        shell: bash
        env:
          IMAGE_REF: ${{ needs.resolve-image.outputs.image_ref }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE_REF"
          docker image inspect "$IMAGE_REF" > n2_results/provenance/HOME_ASSISTANT_IMAGE_INSPECT.json

      - name: Run frozen N2 in native Home Assistant
        shell: bash
        env:
          IMAGE_REF: ${{ needs.resolve-image.outputs.image_ref }}
          REPLICA: ${{ matrix.replica }}
        run: |
          set -euo pipefail
          docker run --rm --network none \
            -e PYTHONPATH=/repo/agentmark_e3b_lab:/repo \
            -v "$PWD:/repo:ro" \
            -v "$PWD/n2_results:/results" \
            --entrypoint python3 \
            "$IMAGE_REF" \
            /repo/agentmark_natural_controllers/better_thermostat/experiment.py \
              --blueprint /results/better_thermostat_lean.yaml \
              --replica "$REPLICA" \
              --trials 6 \
              --out "/results/replica-${REPLICA}.json"

      - name: Independently recompute N2 from raw service events
        shell: bash
        env:
          REPLICA: ${{ matrix.replica }}
        run: |
          set -euo pipefail
          python agentmark_natural_controllers/better_thermostat/validate_result.py \
            "n2_results/replica-${REPLICA}.json" \
            --out "n2_results/validation-${REPLICA}.json"
          manifest="n2_results/manifest-${REPLICA}.sha256"
          find n2_results -type f ! -name "manifest-${REPLICA}.sha256" -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 -r sha256sum \
            > "$manifest"
          test -s "$manifest"

      - name: Upload independently validated N2 replica
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentmark-n2-better-thermostat-r${{ matrix.replica }}
          path: n2_results
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: [resolve-image, n2]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: agentmark-n2-better-thermostat-r*
          path: replicas

      - name: Aggregate exactly two independently validated N2 replicas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aggregate
          printf '%s\n' '${{ needs.resolve-image.outputs.image_ref }}' > aggregate/HOME_ASSISTANT_IMAGE_REF.txt
          mapfile -t results < <(find replicas -type f -name 'replica-*.json' | sort)
          mapfile -t vals < <(find replicas -type f -name 'validation-*.json' | sort)
          mapfile -t sources < <(find replicas -type f -name 'better_thermostat_lean.yaml' | sort)
          test "${#results[@]}" -eq 2
          test "${#vals[@]}" -eq 2
          test "${#sources[@]}" -eq 2
          cmp "${sources[0]}" "${sources[1]}"
          python agentmark_natural_controllers/better_thermostat/aggregate_replicas.py \
            "${results[@]}" \
            --validations "${vals[@]}" \
            --image-ref-file aggregate/HOME_ASSISTANT_IMAGE_REF.txt \
            --out aggregate/N2_BETTER_THERMOSTAT_REPLICATED.json
          cp agentmark_natural_controllers/action_identity.py aggregate/
          cp agentmark_natural_controllers/better_thermostat/PREREGISTRATION.md aggregate/
          cp agentmark_natural_controllers/better_thermostat/experiment.py aggregate/
          cp agentmark_natural_controllers/better_thermostat/validate_result.py aggregate/
          cp agentmark_natural_controllers/better_thermostat/aggregate_replicas.py aggregate/
          cp "${sources[0]}" aggregate/EXTERNAL_better_thermostat_lean.yaml
          (
            cd aggregate
            sha256sum \
              HOME_ASSISTANT_IMAGE_REF.txt \
              N2_BETTER_THERMOSTAT_REPLICATED.json \
              action_identity.py \
              PREREGISTRATION.md \
              experiment.py \
              validate_result.py \
              aggregate_replicas.py \
              EXTERNAL_better_thermostat_lean.yaml \
              > CHECKSUMS.sha256
            sha256sum -c CHECKSUMS.sha256
          )

      - name: Upload replicated N2 promotion bundle
        uses: actions/upload-artifact@v4
        with:
          name: agentmark-n2-better-thermostat-replicated
          path: aggregate
          if-no-files-found: error
          retention-days: 90
