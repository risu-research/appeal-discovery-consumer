name: AgentMark E3b Source Snapshot
on:
  workflow_dispatch:
  push:
    branches: [agentmark-e3b-lab]
    paths:
      - '.github/workflows/agentmark-e3b-source-snapshot.yml'
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record commit metadata
        run: |
          mkdir -p provenance
          printf '%s\n' "${GITHUB_SHA}" > provenance/GITHUB_SHA.txt
          git status --porcelain=v1 > provenance/GIT_STATUS.txt
          git ls-tree -r --full-tree HEAD agentmark_e3b_lab agentmark_e3b_audit .github/workflows/agentmark-e3b-ladder.yml .github/workflows/agentmark-e3b-causal-audit.yml > provenance/GIT_LS_TREE.txt
      - name: Upload exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: agentmark-e3b-source-snapshot
          path: |
            agentmark_e3b_lab
            agentmark_e3b_audit
            .github/workflows/agentmark-e3b-ladder.yml
            .github/workflows/agentmark-e3b-causal-audit.yml
            provenance
          if-no-files-found: error
