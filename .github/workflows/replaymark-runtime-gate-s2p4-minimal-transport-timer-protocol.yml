name: ReplayMark Gate S2-P4 minimal transport-timer discriminator protocol freeze
on:
  workflow_dispatch:
  push:
    branches:
      - replaymark-runtime-gate-s2p4-minimal-transport-timer-protocol
permissions:
  contents: read
jobs:
  gate-s2p4-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GATE: /tmp/replaymark-s2p4-protocol
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static compile protocol verifier
        run: python -m py_compile replaymark_verification/verify_s2p4_minimal_transport_timer_protocol.py
      - name: Verify prospective P4 protocol freeze
        run: |
          mkdir -p "$GATE"
          python replaymark_verification/verify_s2p4_minimal_transport_timer_protocol.py --out "$GATE/p4_protocol_gate.json"
      - name: Seal P4 protocol
        run: |
          set -euo pipefail
          cp replaymark/S2P4_MINIMAL_TRANSPORT_TIMER_DISCRIMINATOR.json "$GATE/"
          cp replaymark/S2P4_MINIMAL_TRANSPORT_TIMER_DISCRIMINATOR.md "$GATE/"
          git show --no-patch --format=fuller HEAD > "$GATE/SEAL_COMMIT.txt"
          (cd "$GATE" && sha256sum * > SHA256SUMS)
      - name: Upload P4 protocol seal
        uses: actions/upload-artifact@v4
        with:
          name: replaymark-gate-s2p4-minimal-transport-timer-protocol
          path: ${{ env.GATE }}
          if-no-files-found: error
          retention-days: 90
