name: AgentMark E3b R0-R1-R2 Mosquitto Ladder
on:
  workflow_dispatch:
  push:
    branches: [agentmark-e3b-lab]
    paths:
      - 'agentmark_e3b_lab/**'
      - '.github/workflows/agentmark-e3b-ladder.yml'
jobs:
  e3b-ladder:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run decisive Mosquitto R0/R1/R2 + certificate gate
        working-directory: agentmark_e3b_lab
        run: ./e3_mqtt/run_ladder.sh
      - name: Upload decisive report
        uses: actions/upload-artifact@v4
        with:
          name: agentmark-e3b-r0-r1-r2-certificate
          path: agentmark_e3b_lab/e3_mqtt/results/e3b_r0_r1_r2_certificate.json
