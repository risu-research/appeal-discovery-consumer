name: AgentMark E3c No-Shift Causal Autopsy

on:
  workflow_dispatch:
  push:
    branches: [agentmark-e3c-home-assistant]
    paths:
      - 'agentmark_e3c_autopsy/**'
      - '.github/workflows/agentmark-e3c-no-shift-autopsy.yml'

permissions:
  contents: read

jobs:
  autopsy:
    strategy:
      fail-fast: false
      matrix:
        replica: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Materialize frozen E3c base and v3 diagnostic source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p autopsy_results/provenance
          cat agentmark_e3c_ha/home_assistant_ecological.part1.pyfrag \
              agentmark_e3c_ha/home_assistant_ecological.part2.pyfrag \
              agentmark_e3c_ha/home_assistant_ecological.part3.pyfrag \
              > autopsy_results/home_assistant_ecological.py
          cp agentmark_e3c_autopsy/no_shift_autopsy_v2.py autopsy_results/no_shift_autopsy_v3.py
          python -c 'from pathlib import Path; p=Path("autopsy_results/no_shift_autopsy_v3.py"); s=p.read_text(); old="            candidates = obs_by_entity.get(entity_id, [])\n            if len(candidates) != 1:\n                raise AssertionError(f\"expected one observation for {entity_id}, got {len(candidates)}\")\n            o = candidates[0]\n"; new="            candidates = obs_by_entity.get(entity_id, [])\n            if not candidates:\n                raise AssertionError(f\"expected at least one observation for {entity_id}\")\n            # R2 VERIFY can create a second wait; choose the scientific decision monitor by earliest absolute deadline.\n            o = min(candidates, key=lambda x: int(x[\"deadline_ns\"]))\n"; assert s.count(old)==1; p.write_text(s.replace(old,new,1))'
          python -m py_compile autopsy_results/home_assistant_ecological.py autopsy_results/no_shift_autopsy_v3.py
          printf '%s\n' "$GITHUB_SHA" > autopsy_results/provenance/GITHUB_SHA.txt
          printf '%s\n' '${{ matrix.replica }}' > autopsy_results/provenance/REPLICA.txt
          printf '%s\n' 'ghcr.io/home-assistant/home-assistant@sha256:372d991e58882a1d8c68c07e9aa3f3b509276e695355f73ccdb03baa70407293' > autopsy_results/provenance/HOME_ASSISTANT_IMAGE_REF.txt
          printf '%s\n' 'R2 VERIFY may create a second wait for one entity. Select the observation with the earliest absolute deadline; this identifies the frozen 100 ms decision monitor without using its outcome.' > autopsy_results/provenance/V3_ASSOCIATION_RULE.txt
          sha256sum autopsy_results/home_assistant_ecological.py autopsy_results/no_shift_autopsy_v3.py agentmark_e3c_ha/PREREGISTRATION.md > autopsy_results/provenance/SOURCE_SHA256.txt

      - name: Pull exact Home Assistant image
        run: docker pull ghcr.io/home-assistant/home-assistant@sha256:372d991e58882a1d8c68c07e9aa3f3b509276e695355f73ccdb03baa70407293

      - name: Run minimally perturbative indexed-observer autopsy v3
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none \
            -e PYTHONPATH=/repo/agentmark_e3b_lab \
            -v "$PWD:/repo:ro" \
            -v "$PWD/autopsy_results:/results" \
            --entrypoint python3 \
            ghcr.io/home-assistant/home-assistant@sha256:372d991e58882a1d8c68c07e9aa3f3b509276e695355f73ccdb03baa70407293 \
            /results/no_shift_autopsy_v3.py \
              --base-script /results/home_assistant_ecological.py \
              --replica '${{ matrix.replica }}' \
              --tasks 128 \
              --trials 6 \
              --wave-size 32 \
              --wave-period-ms 300 \
              --source-delay-ms 35 \
              --target-delay-ms 180 \
              --verify-ms 100 \
              --out '/results/autopsy-v3-${{ matrix.replica }}.json'
          sha256sum autopsy_results/autopsy-v3-${{ matrix.replica }}.json > autopsy_results/provenance/AUTOPSY_SHA256.txt

      - name: Upload causal autopsy v3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentmark-e3c-no-shift-autopsy-v3-r${{ matrix.replica }}
          path: autopsy_results
          if-no-files-found: error
          retention-days: 90
