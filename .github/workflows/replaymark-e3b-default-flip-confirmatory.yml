name: ReplayMark E3b Documented-Default Capacity Flip

on:
  workflow_dispatch:
  push:
    branches: [replaymark-e3b-default-flip]
    paths:
      - 'replaymark_e3b_default_flip/confirmatory/**'
      - '.github/workflows/replaymark-e3b-default-flip-confirmatory.yml'

jobs:
  confirmatory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        replica: [A, B]
        batch_size: [166, 167, 250, 251]
    steps:
      - uses: actions/checkout@v4

      - name: Materialize documented-default queue-policy configuration
        shell: bash
        run: |
          mkdir -p replaymark_e3b_default_flip/confirmatory/runtime replaymark_e3b_default_flip/results_confirmatory
          cat > replaymark_e3b_default_flip/confirmatory/runtime/mosquitto.conf <<'EOF'
          listener 1883 0.0.0.0
          allow_anonymous true
          persistence false
          sys_interval 1
          log_type error
          log_type warning
          log_type notice
          EOF
          cp replaymark_e3b_default_flip/confirmatory/runtime/mosquitto.conf \
            replaymark_e3b_default_flip/results_confirmatory/mosquitto_default_queue_${{ matrix.replica }}_n${{ matrix.batch_size }}.conf
          if grep -Eq '^[[:space:]]*(max_queued_messages|max_queued_bytes|max_inflight_messages|queue_qos0_messages)[[:space:]]' \
            replaymark_e3b_default_flip/confirmatory/runtime/mosquitto.conf; then
            echo 'Forbidden queue-policy directive present' >&2
            exit 2
          fi
          sha256sum replaymark_e3b_default_flip/confirmatory/runtime/mosquitto.conf

      - name: Resolve and record Mosquitto image digest
        shell: bash
        run: |
          docker pull eclipse-mosquitto:2.1.2-alpine
          BROKER_DIGEST="$(docker image inspect eclipse-mosquitto:2.1.2-alpine --format '{{index .RepoDigests 0}}')"
          test -n "$BROKER_DIGEST"
          echo "BROKER_DIGEST=$BROKER_DIGEST" >> "$GITHUB_ENV"
          echo "$BROKER_DIGEST"

      - name: Build frozen confirmatory image
        working-directory: replaymark_e3b_default_flip/confirmatory
        run: docker compose build device runner

      - name: Start fresh Mosquitto and device
        working-directory: replaymark_e3b_default_flip/confirmatory
        run: docker compose up -d mosquitto device

      - name: Execute six frozen trials
        working-directory: replaymark_e3b_default_flip/confirmatory
        run: >-
          docker compose run --rm runner
          --broker mosquitto
          --batch-size ${{ matrix.batch_size }}
          --replica ${{ matrix.replica }}
          --trials 6
          --wave-size 32
          --wave-period-ms 300
          --verify-ms 100
          --target-delay-ms 150
          --gap-ms 20
          --timeout-ms 1200
          --drain-quiet-s 0.75
          --drain-timeout-s 20
          --broker-image-digest "$BROKER_DIGEST"
          --git-sha "$GITHUB_SHA"
          --config-path /evidence/mosquitto.conf
          --out /results/default_flip_${{ matrix.replica }}_n${{ matrix.batch_size }}.json

      - name: Preserve broker log
        if: always()
        working-directory: replaymark_e3b_default_flip/confirmatory
        shell: bash
        run: |
          docker compose logs --no-color mosquitto > ../results_confirmatory/broker_default_${{ matrix.replica }}_n${{ matrix.batch_size }}.log || true

      - name: Upload raw confirmatory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replaymark-e3b-default-flip-${{ matrix.replica }}-n${{ matrix.batch_size }}
          path: |
            replaymark_e3b_default_flip/results_confirmatory/default_flip_${{ matrix.replica }}_n${{ matrix.batch_size }}.json
            replaymark_e3b_default_flip/results_confirmatory/mosquitto_default_queue_${{ matrix.replica }}_n${{ matrix.batch_size }}.conf
            replaymark_e3b_default_flip/results_confirmatory/broker_default_${{ matrix.replica }}_n${{ matrix.batch_size }}.log
          if-no-files-found: warn

      - name: Tear down isolated broker
        if: always()
        working-directory: replaymark_e3b_default_flip/confirmatory
        run: docker compose down -v --remove-orphans

  validate:
    needs: confirmatory
    if: always() && needs.confirmatory.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Download all raw confirmatory evidence
        uses: actions/download-artifact@v4
        with:
          pattern: replaymark-e3b-default-flip-*
          path: default_flip_inputs
          merge-multiple: true

      - name: Independent frozen-protocol validation
        run: |
          mkdir -p replaymark_e3b_default_flip/results_confirmatory
          python replaymark_e3b_default_flip/confirmatory/validate_default_flip.py \
            --input-dir default_flip_inputs \
            --out replaymark_e3b_default_flip/results_confirmatory/default_flip_certificate.json

      - name: Upload confirmation certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replaymark-e3b-default-flip-certificate
          path: replaymark_e3b_default_flip/results_confirmatory/default_flip_certificate.json
          if-no-files-found: warn
