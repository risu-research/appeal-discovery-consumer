name: ReplayMark External Transfer Artifact Hardening

on:
  push:
    branches:
      - replaymark-external-transfer-artifact-hardening
    paths:
      - 'replaymark_theory/external_transfer/**'
      - '.github/workflows/replaymark-external-transfer-artifact-hardening.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  artifact-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout hardening branch at exact action revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Record authority
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee /tmp/HARDENING_HEAD.txt
          test -f replaymark_theory/external_transfer/EXTERNAL_RETENTION_TRANSFER_PROTOCOL.md
          test -f replaymark_theory/external_transfer/audit_external_retention_transfer.py
          test -f replaymark_theory/external_transfer/audit_external_retention_transfer_hardened.py
          test -f replaymark_theory/external_transfer/EXTERNAL_TRANSFER_ARTIFACT_HARDENING.md

      - name: Fetch exact pinned third-party snapshots
        shell: bash
        run: |
          set -euo pipefail
          INPUT=/tmp/replaymark_external_inputs
          mkdir -p "$INPUT"
          NVIDIA_COMMIT=26092ade9de608a71695bfc5800c956b8658ee98
          AIPERF_COMMIT=13ae4f6b6b5363007ad52ee2470c3b49c9403b34

          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/NVIDIA/TensorRT-LLM/${NVIDIA_COMMIT}/tensorrt_llm/scaffolding/trace_replay/replay.py" \
            -o "$INPUT/nvidia_replay.py"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/NVIDIA/TensorRT-LLM/${NVIDIA_COMMIT}/examples/scaffolding/trace_replay/trace_example/matplotlib__matplotlib-23412/matplotlib__matplotlib-23412.trace.json" \
            -o "$INPUT/nvidia_trace.json"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/NVIDIA/TensorRT-LLM/${NVIDIA_COMMIT}/examples/scaffolding/trace_replay/README.md" \
            -o "$INPUT/nvidia_README.md"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/NVIDIA/TensorRT-LLM/${NVIDIA_COMMIT}/docs/source/blogs/tech_blog/blog27_Evaluating_Agentic_Serving_with_Trace_Replay_and_Job_Level_Metrics.md" \
            -o "$INPUT/nvidia_blog.md"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/NVIDIA/TensorRT-LLM/${NVIDIA_COMMIT}/LICENSE" \
            -o "$INPUT/nvidia_LICENSE"

          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/ai-dynamo/aiperf/${AIPERF_COMMIT}/docs/tutorials/weka-trace.md" \
            -o "$INPUT/aiperf_weka_trace.md"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/ai-dynamo/aiperf/${AIPERF_COMMIT}/docs/tutorials/agentx-mvp.md" \
            -o "$INPUT/aiperf_agentx_mvp.md"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/ai-dynamo/aiperf/${AIPERF_COMMIT}/src/aiperf/dataset/loader/weka_trace.py" \
            -o "$INPUT/aiperf_weka_trace.py"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/ai-dynamo/aiperf/${AIPERF_COMMIT}/src/aiperf/timing/branch_orchestrator.py" \
            -o "$INPUT/aiperf_branch_orchestrator.py"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/ai-dynamo/aiperf/${AIPERF_COMMIT}/LICENSE" \
            -o "$INPUT/aiperf_LICENSE"

      - name: Recover exact original Actions evidence and verify digest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/original_evidence
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9983484671/zip" \
            -o /tmp/original_replaymark_external_transfer.zip
          echo "44a5adf0ee21f5b4397ab0c1633bea1aeb195787058986a53b6488c3695a7969  /tmp/original_replaymark_external_transfer.zip" | sha256sum -c -
          unzip -q /tmp/original_replaymark_external_transfer.zip -d /tmp/original_evidence
          test -f /tmp/original_evidence/EXTERNAL_RETENTION_TRANSFER_RESULTS.json
          test -f /tmp/original_evidence/EXTERNAL_RETENTION_TRANSFER_REPORT.md

      - name: Re-run frozen scientific auditor on exact inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/reproduced_original
          python replaymark_theory/external_transfer/audit_external_retention_transfer.py \
            --input-dir /tmp/replaymark_external_inputs \
            --output-dir /tmp/reproduced_original
          cmp /tmp/original_evidence/EXTERNAL_RETENTION_TRANSFER_RESULTS.json /tmp/reproduced_original/EXTERNAL_RETENTION_TRANSFER_RESULTS.json
          cmp /tmp/original_evidence/EXTERNAL_RETENTION_TRANSFER_REPORT.md /tmp/reproduced_original/EXTERNAL_RETENTION_TRANSFER_REPORT.md

      - name: Run post-result hardened verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hardened_results
          python replaymark_theory/external_transfer/audit_external_retention_transfer_hardened.py \
            --input-dir /tmp/replaymark_external_inputs \
            --output-dir /tmp/hardened_results
          cat /tmp/hardened_results/HARDENED_EXTERNAL_TRANSFER_REPORT.md

      - name: Assemble standalone capsule tree
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/replaymark_external_transfer_capsule
          mkdir -p \
            "$ROOT/00_READ_FIRST" \
            "$ROOT/01_FROZEN_SCIENCE" \
            "$ROOT/02_POST_RESULT_HARDENING" \
            "$ROOT/03_ORIGINAL_RUN_EVIDENCE" \
            "$ROOT/04_REPRODUCED_ORIGINAL" \
            "$ROOT/05_HARDENED_RESULTS" \
            "$ROOT/06_PINNED_UPSTREAM_SNAPSHOTS/NVIDIA_TensorRT-LLM" \
            "$ROOT/06_PINNED_UPSTREAM_SNAPSHOTS/AIPerf" \
            "$ROOT/07_MANIFESTS"

          cp replaymark_theory/external_transfer/EXTERNAL_RETENTION_TRANSFER_PROTOCOL.md "$ROOT/01_FROZEN_SCIENCE/"
          cp replaymark_theory/external_transfer/audit_external_retention_transfer.py "$ROOT/01_FROZEN_SCIENCE/"
          cp .github/workflows/replaymark-external-retention-transfer.yml "$ROOT/01_FROZEN_SCIENCE/"

          cp replaymark_theory/external_transfer/EXTERNAL_TRANSFER_ARTIFACT_HARDENING.md "$ROOT/02_POST_RESULT_HARDENING/"
          cp replaymark_theory/external_transfer/audit_external_retention_transfer_hardened.py "$ROOT/02_POST_RESULT_HARDENING/"
          cp .github/workflows/replaymark-external-transfer-artifact-hardening.yml "$ROOT/02_POST_RESULT_HARDENING/"

          cp /tmp/original_replaymark_external_transfer.zip "$ROOT/03_ORIGINAL_RUN_EVIDENCE/ORIGINAL_GITHUB_ACTIONS_ARTIFACT.zip"
          cp /tmp/original_evidence/* "$ROOT/03_ORIGINAL_RUN_EVIDENCE/"
          cp /tmp/reproduced_original/* "$ROOT/04_REPRODUCED_ORIGINAL/"
          cp /tmp/hardened_results/* "$ROOT/05_HARDENED_RESULTS/"

          cp /tmp/replaymark_external_inputs/nvidia_replay.py "$ROOT/06_PINNED_UPSTREAM_SNAPSHOTS/NVIDIA_TensorRT-LLM/replay.py"
          cp /tmp/replaymark_external_inputs/nvidia_trace.json "$ROOT/06_PINNED_UPSTREAM_SNAPSHOTS/NVIDIA_TensorRT-LLM/matplotlib__matplotlib-23412.trace.json"
          cp /tmp/replaymark_external_inputs/nvidia_README.md "$ROOT/06_PINNED_UPSTREAM_SNAPSHOTS/NVIDIA_TensorRT-LLM/README.md"
          cp /tmp/replaymark_external_inputs/nvidia_blog.md "$ROOT/06_PINNED_UPSTREAM_SNAPSHOTS/NVIDIA_TensorRT-LLM/agentic_trace_replay_blog.md"
          cp /tmp/replaymark_external_inputs/nvidia_LICENSE "$ROOT/06_PINNED_UPSTREAM_SNAPSHOTS/NVIDIA_TensorRT-LLM/LICENSE"

          cp /tmp/replaymark_external_inputs/aiperf_weka_trace.md "$ROOT/06_PINNED_UPSTREAM_SNAPSHOTS/AIPerf/weka-trace.md"
          cp /tmp/replaymark_external_inputs/aiperf_agentx_mvp.md "$ROOT/06_PINNED_UPSTREAM_SNAPSHOTS/AIPerf/agentx-mvp.md"
          cp /tmp/replaymark_external_inputs/aiperf_weka_trace.py "$ROOT/06_PINNED_UPSTREAM_SNAPSHOTS/AIPerf/weka_trace.py"
          cp /tmp/replaymark_external_inputs/aiperf_branch_orchestrator.py "$ROOT/06_PINNED_UPSTREAM_SNAPSHOTS/AIPerf/branch_orchestrator.py"
          cp /tmp/replaymark_external_inputs/aiperf_LICENSE "$ROOT/06_PINNED_UPSTREAM_SNAPSHOTS/AIPerf/LICENSE"

          cp /tmp/hardened_results/UPSTREAM_MANIFEST.json "$ROOT/07_MANIFESTS/UPSTREAM_MANIFEST.json"
          cp /tmp/HARDENING_HEAD.txt "$ROOT/07_MANIFESTS/HARDENING_HEAD.txt"
          printf '%s\n' \
            'scientific_execution_head=96edce97f4b79641dcf4b1975e18218f39e37c97' \
            'frozen_protocol_commit=c7e60c5e03712e7a30ac1e53bccfa2025bfb6fa1' \
            'frozen_auditor_commit=920b759c660a711d94f7aa92bd8059acba8965dc' \
            'original_run_id=34014534101' \
            'original_artifact_id=9983484671' \
            'original_artifact_sha256=44a5adf0ee21f5b4397ab0c1633bea1aeb195787058986a53b6488c3695a7969' \
            'actions_checkout_commit=11d5960a326750d5838078e36cf38b85af677262' \
            'actions_upload_artifact_commit=ea165f8d65b6e75b540449e92b4886f43607fa02' \
            > "$ROOT/07_MANIFESTS/AUTHORITY.txt"

          cat > "$ROOT/00_READ_FIRST/README.md" <<'EOF'
          # ReplayMark External Retention-Transfer — Standalone Capsule

          This capsule preserves the original frozen source-transfer result and adds post-result artifact hardening without changing the scientific claim.

          ## Read order
          1. `01_FROZEN_SCIENCE/EXTERNAL_RETENTION_TRANSFER_PROTOCOL.md`
          2. `03_ORIGINAL_RUN_EVIDENCE/EXTERNAL_RETENTION_TRANSFER_REPORT.md`
          3. `02_POST_RESULT_HARDENING/EXTERNAL_TRANSFER_ARTIFACT_HARDENING.md`
          4. `05_HARDENED_RESULTS/HARDENED_EXTERNAL_TRANSFER_REPORT.md`
          5. `07_MANIFESTS/UPSTREAM_MANIFEST.json`
          6. `07_MANIFESTS/CHECKSUMS.sha256`

          ## Scientific boundary
          The original source-transfer result is G3 PASS only. G4 external invalidity and G5 downstream flip remain NOT SATISFIED. The hardening verifier confirms artifact robustness; it does not upgrade those claims.

          ## Offline verification
          From the capsule root:

          ```bash
          sha256sum -c 07_MANIFESTS/CHECKSUMS.sha256
          python 01_FROZEN_SCIENCE/audit_external_retention_transfer.py --input-dir /path/to/input-aliases --output-dir /tmp/original
          ```

          The embedded upstream snapshots are stored under human-readable upstream paths. `UPSTREAM_MANIFEST.json` records the exact repository commits, Git blob identities, SHA-256 values, and byte lengths used by the verifier.
          EOF

          (
            cd "$ROOT"
            find . -type f ! -path './07_MANIFESTS/CHECKSUMS.sha256' -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              > 07_MANIFESTS/CHECKSUMS.sha256
            sha256sum -c 07_MANIFESTS/CHECKSUMS.sha256
          )

      - name: Build deterministic standalone ZIP and verify it
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo
          root = Path('/tmp/replaymark_external_transfer_capsule')
          out = Path('/tmp/replaymark-external-retention-transfer-standalone-v2.zip')
          with ZipFile(out, 'w', compression=ZIP_DEFLATED, compresslevel=9) as zf:
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                  rel = p.relative_to(root).as_posix()
                  info = ZipInfo(rel, date_time=(1980, 1, 1, 0, 0, 0))
                  info.compress_type = ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  zf.writestr(info, p.read_bytes(), compress_type=ZIP_DEFLATED, compresslevel=9)
          PY
          sha256sum /tmp/replaymark-external-retention-transfer-standalone-v2.zip | tee /tmp/STANDALONE_ZIP_SHA256.txt
          rm -rf /tmp/verify_capsule
          mkdir -p /tmp/verify_capsule
          unzip -q /tmp/replaymark-external-retention-transfer-standalone-v2.zip -d /tmp/verify_capsule
          (
            cd /tmp/verify_capsule
            sha256sum -c 07_MANIFESTS/CHECKSUMS.sha256
          )

      - name: Upload immutable standalone capsule
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: replaymark-external-retention-transfer-standalone-v2
          path: |
            /tmp/replaymark-external-retention-transfer-standalone-v2.zip
            /tmp/STANDALONE_ZIP_SHA256.txt
          if-no-files-found: error
          retention-days: 90
