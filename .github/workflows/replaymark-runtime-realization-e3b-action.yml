name: ReplayMark E3b historical-action realization

on:
  push:
    branches:
      - replaymark-runtime-realization-e3b-action
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e3b-historical-action-realization-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static compile runtime realization increment
        run: |
          python -m py_compile \
            replaymark/runtime_realization.py \
            replaymark/runtime_e3b_observation.py \
            replaymark/runtime_e3b_action.py \
            replaymark_oracle/e3b_observation_oracle.py \
            replaymark_oracle/e3b_action_oracle.py \
            replaymark_verification/verify_runtime_realization_observation.py \
            replaymark_verification/verify_runtime_realization_action.py

      - name: Verify semantic seed remains frozen
        run: python replaymark/verify_seed.py

      - name: Reverify CompiledContract API freeze
        run: python replaymark_verification/verify_compiled_contract_api.py

      - name: Reverify E3b observation realization
        run: |
          mkdir -p /tmp/replaymark-runtime-action
          python replaymark_verification/verify_runtime_realization_observation.py \
            --out /tmp/replaymark-runtime-action/runtime_observation_gate.json

      - name: Verify E3b historical-action realization
        run: |
          python replaymark_verification/verify_runtime_realization_action.py \
            --out /tmp/replaymark-runtime-action/runtime_action_gate.json

      - name: Reverify concrete contract packaging
        run: |
          python replaymark_verification/verify_compiled_contract_packaging.py \
            --out /tmp/replaymark-runtime-action/concrete_contract_gate.json

      - name: Reverify compiler-observed target provenance
        run: |
          python replaymark_verification/verify_target_provenance.py \
            --out /tmp/replaymark-runtime-action/target_provenance_gate.json

      - name: Reverify bounded q compiler
        run: |
          python replaymark_verification/verify_bounded_q.py \
            | tee /tmp/replaymark-runtime-action/q_gate.json

      - name: Reverify production predictive witnesses
        run: |
          python replaymark_verification/verify_predictive_witness.py \
            --out /tmp/replaymark-runtime-action/predictive_witness_gate.json

      - name: Reverify compiler-owned evidence semantics
        run: |
          python replaymark_verification/verify_evidence_semantics.py \
            --out /tmp/replaymark-runtime-action/evidence_semantics_gate.json

      - name: Reverify q evidence image
        run: |
          python replaymark_verification/verify_evidence_image.py \
            --out /tmp/replaymark-runtime-action/evidence_image_gate.json

      - name: Reverify support envelope
        run: |
          python replaymark_verification/verify_support_envelope.py \
            --out /tmp/replaymark-runtime-action/support_envelope_gate.json

      - name: Reverify three-valued adjudicator
        run: |
          python replaymark_verification/verify_adjudicator.py \
            --out /tmp/replaymark-runtime-action/adjudicator_gate.json

      - name: Reverify Rstar maximal certified reuse
        run: |
          python replaymark_verification/verify_rstar.py \
            --out /tmp/replaymark-runtime-action/rstar_gate.json

      - name: Seal E3b historical-action realization gate
        env:
          GATE_DIR: /tmp/replaymark-runtime-action
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          gate_dir = Path(os.environ["GATE_DIR"])
          expected = (
              "runtime_observation_gate.json",
              "runtime_action_gate.json",
              "concrete_contract_gate.json",
              "target_provenance_gate.json",
              "q_gate.json",
              "predictive_witness_gate.json",
              "evidence_semantics_gate.json",
              "evidence_image_gate.json",
              "support_envelope_gate.json",
              "adjudicator_gate.json",
              "rstar_gate.json",
          )
          for name in expected:
              path = gate_dir / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"missing/empty gate output: {path}")
              parsed = json.loads(path.read_text(encoding="utf-8"))
              if parsed.get("verdict") != "PASS":
                  raise SystemExit(f"gate is not PASS: {name}")

          action = json.loads(
              (gate_dir / "runtime_action_gate.json").read_text(encoding="utf-8")
          )
          if action.get("schema") != "replaymark.runtime-realization.e3b-action-gate.v1":
              raise SystemExit("unexpected E3b action gate schema")

          sources = (
              Path("replaymark/runtime_realization.py"),
              Path("replaymark/runtime_e3b_observation.py"),
              Path("replaymark/runtime_e3b_action.py"),
              Path("replaymark/RUNTIME_REALIZATION_BOUNDARY.md"),
              Path("replaymark/E3B_HISTORICAL_ACTION_REALIZATION.md"),
              Path("replaymark_oracle/e3b_observation_oracle.py"),
              Path("replaymark_oracle/e3b_action_oracle.py"),
              Path("replaymark_verification/verify_runtime_realization_observation.py"),
              Path("replaymark_verification/verify_runtime_realization_action.py"),
              Path("agentmark_e3b_lab/e3_mqtt/app/ladder.py"),
              Path("agentmark_e3b_lab/e3_mqtt/app/device.py"),
              Path("replaymark/compiled_contract.py"),
              Path("replaymark/contracts.py"),
          )
          for path in sources:
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"missing/empty source authority: {path}")

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          (gate_dir / "GATE_STATUS").write_text(
              "schema=replaymark.runtime-realization.e3b-action-gate.v1\n"
              f"head={os.environ['GITHUB_SHA']}\n"
              "runtime_boundary=PASS\n"
              "e3b_observation_realization=PASS\n"
              "e3b_historical_action_realization=PASS\n"
              "runtime_reuse_bridge=NOT_IMPLEMENTED\n"
              "execution_policy=NOT_IMPLEMENTED\n",
              encoding="utf-8",
          )
          (gate_dir / "SOURCE_SHA256SUMS").write_text(
              "".join(f"{digest(path)}  {path.as_posix()}\n" for path in sources),
              encoding="utf-8",
          )
          (gate_dir / "GATE_SHA256SUMS").write_text(
              "".join(
                  f"{digest(gate_dir / name)}  {name}\n"
                  for name in expected
              ),
              encoding="utf-8",
          )
          print(
              f"SEALED E3b historical-action realization gate for "
              f"{os.environ['GITHUB_SHA']} with {len(expected)} PASS gates"
          )
          PY

      - name: Upload sealed E3b historical-action artifact
        uses: actions/upload-artifact@v4
        with:
          name: replaymark-runtime-realization-e3b-action-gate
          path: /tmp/replaymark-runtime-action
          if-no-files-found: error
